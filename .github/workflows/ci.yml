name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    name: Flutter plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter pub publish --dry-run

  oldest-supported:
    name: Flutter 3.19 host app (oldest supported)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.6"
          cache: true
      # The example app uses the newest Gradle template, which Flutter 3.19
      # cannot read; the plugin's own Dart is what this job proves.
      - name: Plugin analyze and tests on Flutter 3.19
        run: |
          rm -rf example
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
        working-directory: plugin
      # A host app generated by Flutter 3.19 itself (AGP 8 template, Kotlin
      # plugin applied by the host) must build with the plugin included.
      - name: Build a Flutter 3.19 app that depends on the plugin
        run: |
          flutter create --platforms=android --project-name host_app host_app
          cd host_app
          flutter pub add 'flutter_app_version_upgrader:{"path":"../plugin"}'
          cat > lib/main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:flutter_app_version_upgrader/flutter_app_version_upgrader.dart';
          import 'package:flutter_app_version_upgrader/ui.dart';
          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await VersionManager.initialize(const VersionManagerConfig(baseUrl: 'https://example.com'));
            runApp(MaterialApp(builder: (c, child) => VersionUpgrader(child: child!), home: const Scaffold()));
          }
          DART
          flutter build apk --debug

  example-android:
    name: Example app (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - run: flutter build apk --debug
        working-directory: example
